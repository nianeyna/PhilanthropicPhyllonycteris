# Builds and tests everything that does not need the game: the Core library and its tests.
# The plugin itself compiles only against an installed copy of Sunless Sea, so releases are made locally
# (see RELEASING.md), never here.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer reads the version from tags
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test PhilanthropicPhyllonycteris.Tests
